# ============================================================================
# VIDNOVA PLATFORM - PRODUCTION DOCKER COMPOSE CONFIGURATION (docker-compose.prod.yml)
# High Availability Architecture: AWS S3 Primary + MinIO Fallback Storage
# ============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      sh -c "python scripts/prefetch_models.py all &&
             python scripts/seed_users.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --timeout-keep-alive 65"
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      ENVIRONMENT: "production"
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      TRANSLATION_BACKEND: ${TRANSLATION_BACKEND:-nllb}
      HF_TOKEN: ${HF_TOKEN}
      TTS_API_URL: "http://tts-service:8001/generate_tts"
      DATABASE_URL: ${DATABASE_URL:-postgresql://ai_video:ai_video@db:5432/ai_video}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      
      # Primary Storage: AWS S3 (Production Cloud)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-vidnova-media-prod}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
      
      # Fallback Storage: MinIO (Disaster Recovery & Local Failover)
      MINIO_ENDPOINT_URL: ${MINIO_ENDPOINT_URL:-http://minio:9000}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-vidnova-media}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      
      # Storage Circuit Breaker Policy
      STORAGE_CIRCUIT_BREAKER_ENABLED: "true"
      STORAGE_FAILURE_THRESHOLD: "3"
      STORAGE_RECOVERY_TIMEOUT_SECONDS: "60"
      
      # Security & JWT
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      
      # Payments (VNPay Production)
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET}
      VNPAY_URL: ${VNPAY_URL:-https://pay.vnpay.vn/vpcpay.html}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL}
      VNPAY_EXCHANGE_RATE_USD_VND: ${VNPAY_EXCHANGE_RATE_USD_VND:-25000}
      
      # Mail & OAuth
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      MAIL_FROM: ${MAIL_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen("http://localhost:8000/api/health")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/outputs:/app/outputs
      - ./model-cache:/opt/model-cache

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4 -Ofair
    environment:
      PYTHONUNBUFFERED: "1"
      ENVIRONMENT: "production"
      DATABASE_URL: ${DATABASE_URL:-postgresql://ai_video:ai_video@db:5432/ai_video}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      HF_TOKEN: ${HF_TOKEN}
      TTS_API_URL: "http://tts-service:8001/generate_tts"
      
      # Dual Storage Config
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-vidnova-media-prod}
      MINIO_ENDPOINT_URL: ${MINIO_ENDPOINT_URL:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-vidnova-media}
      STORAGE_CIRCUIT_BREAKER_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/outputs:/app/outputs
      - ./model-cache:/opt/model-cache

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat --loglevel=info
    environment:
      PYTHONUNBUFFERED: "1"
      ENVIRONMENT: "production"
      DATABASE_URL: ${DATABASE_URL:-postgresql://ai_video:ai_video@db:5432/ai_video}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_video}
      POSTGRES_USER: ${POSTGRES_USER:-ai_video}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_video}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_video"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_prod_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  tts-service:
    build:
      context: ./tts_service
      dockerfile: Dockerfile.tts
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      COQUI_TOS_AGREED: "1"
    ports:
      - "8001:8001"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./tts-model-cache:/root/.local/share/tts
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen("http://localhost:8001/health")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_prod_data:
  minio_prod_data:
  redis_prod_data:
