version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: sh -c "python scripts/prefetch_models.py all && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
      - ./model-cache:/opt/model-cache
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      WHISPER_MODEL: "small"
      WHISPER_DEVICE: "cpu"
      TRANSLATION_BACKEND: "nllb"
      HF_TOKEN: ${HF_TOKEN}
      TTS_API_URL: "http://tts-service:8001/generate_tts"
      
      # ============================================================================
      # DATABASE
      # ============================================================================
      DATABASE_URL: "postgresql://ai_video:ai_video@db:5432/ai_video"
      
      # ============================================================================
      # AWS S3 CONFIGURATION
      # ============================================================================
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      
      # ============================================================================
      # VIDEO PROCESSING CONFIGURATION
      # ============================================================================
      SEGMENT_SECONDS: ${SEGMENT_SECONDS:-5}
      
      # ============================================================================
      # JWT & AUTH
      # ============================================================================
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      
      # ============================================================================
      # EMAIL (Optional)
      # ============================================================================
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      MAIL_FROM: ${MAIL_FROM}
      
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN}
      
      # ============================================================================
      # REDIS (for Celery)
      # ============================================================================
      REDIS_URL: "redis://redis:6379/0"
      
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development  # Use development stage
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_S3_BUCKET_URL: ${VITE_S3_BUCKET_URL:-http://localhost:9000}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_MINIO_ENDPOINT: ${VITE_MINIO_ENDPOINT:-http://localhost:9000}
    depends_on:
      - backend
    stdin_open: true
    tty: true

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_video
      POSTGRES_USER: ai_video
      POSTGRES_PASSWORD: ai_video
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_video"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  tts-service:
    build:
      context: ./tts_service
      dockerfile: Dockerfile.tts
    volumes:
      - ./backend/uploads:/app/uploads
      - ./tts-model-cache:/root/.local/share/tts
    environment:
      PYTHONUNBUFFERED: "1"
      COQUI_TOS_AGREED: "1"
    ports:
      - "8001:8001"

  # Update the celery services in docker-compose.yml

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - ./backend:/app
      - ./model-cache:/opt/model-cache
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: "postgresql://ai_video:ai_video@db:5432/ai_video"
      REDIS_URL: "redis://redis:6379/0"
      HF_TOKEN: ${HF_TOKEN}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      WHISPER_MODEL: "small"
      WHISPER_DEVICE: "cpu"
      TRANSLATION_BACKEND: "nllb"
      TTS_API_URL: "http://tts-service:8001/generate_tts"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    depends_on:
      - db
      - redis
      - minio

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: "postgresql://ai_video:ai_video@db:5432/ai_video"
      REDIS_URL: "redis://redis:6379/0"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  minio_data:
  redis_data: