services:
  backend:
    build:
      context: ./backend
    command: sh -c "python scripts/prefetch_models.py all && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    # command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      # A real folder on your machine, NOT a hidden Docker volume — so you
      # can pre-download models on your desktop (or via `docker compose run`,
      # see README) and the container just reads them from disk, no
      # internet needed at build or run time once populated.
      - ./model-cache:/opt/model-cache
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      WHISPER_MODEL: "small"
      WHISPER_DEVICE: "cpu"
      TRANSLATION_BACKEND: "nllb"
      # Required for diarization: pyannote/speaker-diarization-3.1 is gated on
      # Hugging Face — accept the license at huggingface.co/pyannote/speaker-diarization-3.1
      # then create a free access token and put it in a .env file next to this file:
      HF_TOKEN: ${HF_TOKEN}
      TTS_API_URL: "http://tts-service:8001/generate_tts"
      
      # ============================================================================
      # AWS S3 CONFIGURATION - ADD THESE LINES
      # ============================================================================
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      
      # ============================================================================
      # VIDEO PROCESSING CONFIGURATION
      # ============================================================================
      SEGMENT_SECONDS: ${SEGMENT_SECONDS:-5}
      
    depends_on:
      - db
      - redis

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_video
      POSTGRES_USER: ai_video
      POSTGRES_PASSWORD: ai_video
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  tts-service:
    build:
      context: ./tts_service
      dockerfile: Dockerfile.tts
    volumes:
      - ./backend/uploads:/app/uploads
      - ./tts-model-cache:/root/.local/share/tts
    environment:
      PYTHONUNBUFFERED: "1"
      COQUI_TOS_AGREED: "1"

volumes:
  postgres_data:
  minio_data: