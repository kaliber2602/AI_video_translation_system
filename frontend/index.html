<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VidNova - AI Video Translation & Dubbing Workspace</title>
    <meta
      name="description"
      content="VidNova is an all-in-one AI video translation, dubbing, and multilingual localization workspace for content creators and enterprises."
    />
    <link rel="canonical" href="https://vidnova.ai/workspace" />

    <!-- Google Fonts for System Typography Selection -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Lexend:wght@400;500;600;700&family=Open+Sans:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vidnova.ai/workspace" />
    <meta property="og:title" content="VidNova - AI Video Translation & Dubbing Workspace" />
    <meta property="og:description" content="Translate and dub videos automatically with generative AI voice cloning and subtitle generation." />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VidNova - AI Video Translation & Dubbing Workspace" />
    <meta name="twitter:description" content="Translate and dub videos automatically with generative AI voice cloning and subtitle generation." />
    <meta name="twitter:image" content="/favicon.svg" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "VidNova",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "All",
        "description": "AI video translation, dubbing, and voice cloning workspace.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
